name: TWRP-Builder-X6512

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 clang libssl-dev rsync flex bison
          sudo curl https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync TWRP-11 Minimal Manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          repo sync -j$(nproc --all) --force-sync

      - name: Clone Device Tree
        uses: actions/checkout@v4
        with:
          path: ~/twrp/device/infinix/Infinix-X6512

      - name: Build TWRP Boot Image
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_Infinix-X6512-eng
          mka bootimage -j$(nproc --all)

      - name: Upload Compiled TWRP (boot.img)
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Infinix-X6512-boot
          path: ~/twrp/out/target/product/Infinix-X6512/boot.img
