name: TWRP-X6512-Simple-Builder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y repo bc build-essential zip curl libstdc++6 git wget python3 clang libssl-dev rsync flex bison

      - name: Init Manifest and Sync
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j4

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: ~/twrp/device/infinix/X6512

      - name: Start Compilation
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_X6512-eng
          mka bootimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Infinix-X6512-boot
          path: ~/twrp/out/target/product/X6512/boot.img
